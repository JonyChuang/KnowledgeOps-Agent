[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledgeops-agent"
version = "0.1.0"
description = "Enterprise knowledge base and service-desk collaboration agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "KnowledgeOps Contributors" }]
keywords = ["agent", "knowledge-base", "rag", "service-desk", "function-calling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.14,<2.0",
    "qdrant-client>=1.12,<2.0",
    "pypdf>=5.0,<6.0",
    "elasticsearch>=8.15,<9.0",
    "neo4j>=5.28,<6.0",
    "typing-extensions>=4.12,<5.0",
    "langgraph>=1.0,<2.0",
    "celery[redis]>=5.4,<6.0",
    "aiohttp>=3.10,<4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["knowledgeops"]

[project.optional-dependencies]
litellm = ["litellm>=1.60.0,<2.0.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.9.0",
]

[project.scripts]
knowledgeops-api = "knowledgeops.main:main"

[project.urls]
Homepage = "https://github.com/JonyChuang/KnowledgeOps-Agent"
Repository = "https://github.com/JonyChuang/KnowledgeOps-Agent"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
