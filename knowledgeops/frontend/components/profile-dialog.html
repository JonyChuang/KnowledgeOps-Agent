<dialog id="change-password-dialog" class="profile-dialog">
  <form id="change-password-form" class="form-grid" novalidate>
    <div class="dialog-heading">
      <p class="knowledge-eyebrow">账户安全</p>
      <h2>修改密码</h2>
      <p>新密码至少包含 8 个字符。</p>
    </div>
    <label>
      当前密码
      <input id="current-password" type="password" autocomplete="current-password" maxlength="128" required />
    </label>
    <label>
      新密码
      <input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required />
    </label>
    <label>
      确认新密码
      <input id="confirm-new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required />
    </label>
    <p id="change-password-message" class="form-message" role="status"></p>
    <div class="dialog-actions">
      <button id="close-change-password-dialog" class="secondary-action" type="button">取消</button>
      <button id="change-password-submit" class="primary-action" type="submit">更新密码</button>
    </div>
  </form>
</dialog>
