<section id="service-desk-view" class="view">
  <div class="tickets-workspace service-desk-workspace">
    <header class="tickets-header">
      <div>
        <p class="tool-eyebrow">Service Operations</p>
        <h1>待我处理</h1>
        <p>领取待受理请求，协同分派，并将处理过程完整记录在工单时间线中。</p>
      </div>
      <label class="tickets-actor-field" for="service-desk-actor">
        <span>当前处理人</span>
        <div>
          <input id="service-desk-actor" type="text" maxlength="120" />
          <button id="refresh-service-desk" type="button" class="secondary-action">查看</button>
        </div>
      </label>
    </header>
    <section class="tickets-toolbar" aria-label="待我处理筛选">
      <div class="ticket-status-tabs" role="tablist">
        <button type="button" class="ticket-status-tab is-active" data-service-desk-scope="unassigned">待领取</button>
        <button type="button" class="ticket-status-tab" data-service-desk-scope="mine">我的队列</button>
        <button type="button" class="ticket-status-tab" data-service-desk-scope="all">全部队列</button>
      </div>
      <form id="service-desk-search-form" class="ticket-search-form" role="search">
        <label class="sr-only" for="service-desk-search-input">搜索待处理工单</label>
        <input id="service-desk-search-input" type="search" maxlength="200" placeholder="搜索标题、描述或申请人" />
        <button type="submit" class="secondary-action">搜索</button>
      </form>
    </section>
    <p id="service-desk-message" class="form-message" role="status"></p>
    <div class="tickets-layout">
      <section class="tickets-list-panel" aria-label="待处理工单队列">
        <div class="tickets-list-heading">
          <div>
            <h2>处理队列</h2>
            <p id="service-desk-result-summary">正在加载待处理工单...</p>
          </div>
          <span id="service-desk-result-count" class="activity-count">0</span>
        </div>
        <div id="service-desk-list" class="tickets-list"></div>
        <div class="tickets-pagination">
          <button id="service-desk-previous-page" type="button" class="secondary-action">上一页</button>
          <span id="service-desk-page-summary">第 1 页</span>
          <button id="service-desk-next-page" type="button" class="secondary-action">下一页</button>
        </div>
      </section>
      <aside class="ticket-preview-panel" aria-live="polite">
        <div id="service-desk-preview-empty" class="ticket-preview-empty">
          <span class="ticket-preview-symbol" aria-hidden="true">i</span>
          <strong>选择一张服务请求</strong>
          <span>领取工单后，可进行处理、转派、升级或关闭。</span>
        </div>
        <div id="service-desk-preview" hidden></div>
      </aside>
    </div>
  </div>
</section>
