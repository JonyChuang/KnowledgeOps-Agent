<section id="tickets-view" class="view">
  <div class="tickets-workspace">
    <header class="tickets-header">
      <div>
        <p class="tool-eyebrow">Service Desk</p>
        <h1>我的工单</h1>
        <p>集中查看自己提交的服务请求，并按状态或关键词快速定位。</p>
      </div>
      <label class="tickets-actor-field" for="tickets-actor">
        <span>当前操作人</span>
        <div>
          <input id="tickets-actor" type="text" maxlength="120" />
          <button id="refresh-tickets" type="button" class="secondary-action">查看</button>
        </div>
      </label>
    </header>
    <section class="tickets-toolbar" aria-label="工单筛选">
      <div class="ticket-status-tabs" role="tablist">
        <button type="button" class="ticket-status-tab is-active" data-ticket-status="">全部</button>
        <button type="button" class="ticket-status-tab" data-ticket-status="open">待受理</button>
        <button type="button" class="ticket-status-tab" data-ticket-status="in_progress">处理中</button>
        <button type="button" class="ticket-status-tab" data-ticket-status="awaiting_requester">待我补充</button>
        <button type="button" class="ticket-status-tab" data-ticket-status="resolved">已解决</button>
        <button type="button" class="ticket-status-tab" data-ticket-status="closed">已关闭</button>
      </div>
      <form id="ticket-search-form" class="ticket-search-form" role="search">
        <label class="sr-only" for="ticket-search-input">搜索工单</label>
        <input id="ticket-search-input" type="search" maxlength="200" placeholder="搜索标题或问题描述" />
        <button type="submit" class="secondary-action">搜索</button>
      </form>
    </section>
    <p id="tickets-message" class="form-message" role="status"></p>
    <div class="tickets-layout">
      <section class="tickets-list-panel" aria-label="工单列表">
        <div class="tickets-list-heading">
          <div>
            <h2>工单列表</h2>
            <p id="tickets-result-summary">正在加载你的工单...</p>
          </div>
          <span id="tickets-result-count" class="activity-count">0</span>
        </div>
        <div id="tickets-list" class="tickets-list"></div>
        <div class="tickets-pagination">
          <button id="tickets-previous-page" type="button" class="secondary-action">上一页</button>
          <span id="tickets-page-summary">第 1 页</span>
          <button id="tickets-next-page" type="button" class="secondary-action">下一页</button>
        </div>
      </section>
      <aside class="ticket-preview-panel" aria-live="polite">
        <div id="ticket-preview-empty" class="ticket-preview-empty">
          <span class="ticket-preview-symbol" aria-hidden="true">i</span>
          <strong>选择一张工单</strong>
          <span>从列表中选择后，可查看详情、处理进度和补充信息。</span>
        </div>
        <div id="ticket-preview" hidden></div>
      </aside>
    </div>
  </div>
</section>
