<section id="search-view" class="view">
  <div class="search-workspace">
    <header class="tool-page-header search-header">
      <div>
        <p class="tool-eyebrow">Global Search</p>
        <h1>全局搜索</h1>
        <p>同时检索已导入资料、图谱实体、你的历史 Agent 对话和工单。</p>
      </div>
    </header>
    <form id="global-search-form" class="global-search-form" role="search">
      <label class="sr-only" for="global-search-input">全局搜索</label>
      <input id="global-search-input" type="search" maxlength="200" placeholder="搜索知识资料、图谱实体、历史对话或我的工单" required />
      <button type="submit" class="primary-action">搜索</button>
    </form>
    <p id="global-search-message" class="form-message" role="status"></p>
    <section class="global-search-panel" aria-live="polite">
      <div class="section-title-row">
        <div>
          <h2>搜索结果</h2>
          <p id="global-search-summary">输入关键词后开始跨工作区检索。</p>
        </div>
        <span id="global-search-count" class="activity-count">0</span>
      </div>
      <div id="global-search-results" class="global-search-results"></div>
    </section>
  </div>
</section>
