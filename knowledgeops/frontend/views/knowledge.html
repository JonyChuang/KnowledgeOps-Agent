<section id="knowledge-view" class="view">
  <div id="knowledge-catalog" class="knowledge-catalog">
    <header class="knowledge-page-header">
      <div>
        <p class="knowledge-eyebrow">Knowledge Center</p>
        <h1>知识库管理</h1>
        <p>将资料按主题分类，在对话中按知识库精准检索。</p>
      </div>
      <button id="open-knowledge-base-dialog" class="primary-action" type="button">新建知识库</button>
    </header>
    <div id="knowledge-base-list" class="knowledge-card-grid"></div>
  </div>
  <div id="knowledge-detail" class="knowledge-detail" hidden>
    <header class="knowledge-detail-header">
      <button id="back-to-knowledge-catalog" class="back-button" type="button">返回知识库</button>
      <div class="knowledge-detail-title">
        <div>
          <p class="knowledge-eyebrow">知识库</p>
          <h1 id="knowledge-detail-name">知识库</h1>
          <p id="knowledge-detail-description">资料管理与检索范围</p>
        </div>
      </div>
    </header>
    <div class="knowledge-detail-tabs">
      <button class="knowledge-tab is-active" type="button">
        文档
        <span id="knowledge-document-count">0</span>
      </button>
    </div>
    <div class="knowledge-document-toolbar">
      <label class="knowledge-document-search" for="knowledge-document-search-input">
        <span class="sr-only">检索文档</span>
        <input id="knowledge-document-search-input" type="search" placeholder="输入关键词筛选文档" autocomplete="off" />
      </label>
      <div class="knowledge-import-actions">
        <button id="open-local-file-import" class="secondary-action" type="button">本地上传</button>
        <button id="open-web-import" class="secondary-action" type="button">网页导入</button>
        <button id="open-document-import" class="secondary-action" type="button">添加文本</button>
      </div>
    </div>
    <input id="knowledge-local-file-input" type="file" accept=".pdf,.docx,.md,.markdown,.txt,.html,.htm" hidden />
    <button id="knowledge-local-file-dropzone" class="knowledge-document-dropzone" type="button">
      <span class="dropzone-symbol" aria-hidden="true">+</span>
      <strong>点击或拖放文件至此处上传</strong>
      <span>支持 PDF、DOCX、Markdown、TXT 和 HTML，单个文件最大 10 MB</span>
    </button>
    <p id="knowledge-document-message" class="form-message" role="status"></p>
    <div id="knowledge-document-list" class="knowledge-document-list"></div>
  </div>
</section>
