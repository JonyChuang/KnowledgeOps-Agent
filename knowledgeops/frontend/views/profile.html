<section id="profile-view" class="view">
  <div class="profile-page">
    <header class="profile-cover" aria-hidden="true"></header>
    <section class="profile-card" aria-labelledby="profile-title">
      <div class="profile-identity">
        <span id="profile-avatar" class="profile-avatar" aria-hidden="true">K</span>
        <div>
          <p class="profile-eyebrow">个人中心</p>
          <h1 id="profile-title">账户信息</h1>
          <p id="profile-account-summary" class="profile-account-summary">正在加载账户信息...</p>
        </div>
      </div>
      <form id="profile-display-name-form" class="profile-details" novalidate>
        <div class="profile-detail-row">
          <div>
            <span class="profile-detail-label">昵称</span>
            <span class="profile-detail-help">用于工作台、对话和工单中的展示</span>
          </div>
          <div class="profile-edit-control">
            <input id="profile-display-name" type="text" maxlength="120" autocomplete="name" required />
            <button id="profile-display-name-submit" class="secondary-action" type="submit">保存</button>
          </div>
        </div>
        <div class="profile-detail-row">
          <span class="profile-detail-label">账号</span>
          <strong id="profile-username">-</strong>
        </div>
        <div class="profile-detail-row">
          <span class="profile-detail-label">角色</span>
          <strong id="profile-role">-</strong>
        </div>
        <div class="profile-detail-row">
          <span class="profile-detail-label">注册时间</span>
          <strong id="profile-created-at">-</strong>
        </div>
        <div class="profile-detail-row">
          <div>
            <span class="profile-detail-label">密码</span>
            <span class="profile-detail-help">定期更换密码有助于保护账户安全</span>
          </div>
          <button id="open-change-password-dialog" class="secondary-action" type="button">修改密码</button>
        </div>
        <p id="profile-message" class="form-message" role="status"></p>
      </form>
    </section>
  </div>
</section>
