services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: knowledgeops
      POSTGRES_USER: knowledgeops
      POSTGRES_PASSWORD: knowledgeops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgeops -d knowledgeops"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.0
    # Lets host-side tools (for example offline evaluation) reach the local
    # vector store without exposing this unauthenticated development service.
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    # Required by host-side BM25 and hybrid offline evaluation runs.
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?请先在 .env 配置 NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  migrate:
    image: knowledgeops-agent:local
    command: python -m alembic upgrade head
    environment: &app_environment
      DATABASE_URL: postgresql+asyncpg://knowledgeops:knowledgeops@postgres:5432/knowledgeops
      QDRANT_URL: http://qdrant:6333
      ELASTICSEARCH_URL: http://elasticsearch:9200
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OPENAI_API_KEY: ${OPENAI_API_KEY:?请先在 .env 配置 OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CHAT_MODEL: ${CHAT_MODEL:?请在 .env 配置 CHAT_MODEL}
      CHAT_TEMPERATURE: ${CHAT_TEMPERATURE:-0}
      VERIFIER_MODEL: ${VERIFIER_MODEL:-}
      VERIFIER_BASE_URL: ${VERIFIER_BASE_URL:-}
      VERIFIER_API_KEY: ${VERIFIER_API_KEY:-}
      CHAT_BASE_URL: ${CHAT_BASE_URL:?请在 .env 配置 CHAT_BASE_URL}
      CHAT_API_KEY: ${CHAT_API_KEY:?请在 .env 配置 CHAT_API_KEY}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?请在 .env 配置长度至少 32 位的 AUTH_JWT_SECRET}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-28800}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}

      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?请在 .env 配置 EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:?请在 .env 配置 EMBEDDING_DIMENSIONS}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:?请在 .env 配置 EMBEDDING_BASE_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?请在 .env 配置 EMBEDDING_API_KEY}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?请先在 .env 配置 NEO4J_PASSWORD}
      NEO4J_DATABASE: neo4j
      GRAPH_INDEXING_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: knowledgeops-agent:local
    command: python -m uvicorn knowledgeops.api.app:app --host 0.0.0.0 --port 8000
    environment: *app_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      elasticsearch:
        condition: service_started

  worker:
    image: knowledgeops-agent:local
    command: celery -A knowledgeops.tasks.celery_app:celery_app worker --loglevel=INFO
    environment: *app_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./knowledgeops/frontend
    image: knowledgeops-frontend:local
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  elasticsearch_data:
  neo4j_data:
